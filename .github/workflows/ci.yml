name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - name: Install gitleaks
        run: |
          GITLEAKS_ARCHIVE="${RUNNER_TEMP}/gitleaks.tar.gz"
          GITLEAKS_BINARY="${RUNNER_TEMP}/gitleaks"
          curl -sSfL -o "$GITLEAKS_ARCHIVE" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" | sha256sum -c -
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$GITLEAKS_BINARY" /usr/local/bin/gitleaks
      - run: npm run ci
      - run: gitleaks dir . --redact --config .gitleaks.toml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
      - run: npm run image:smoke

  ci-ok:
    if: always()
    needs: [static, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: test "$STATIC_RESULT" = success && test "$IMAGE_RESULT" = success
