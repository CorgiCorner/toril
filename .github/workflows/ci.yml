name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - name: Install gitleaks
        run: |
          GITLEAKS_ARCHIVE="${RUNNER_TEMP}/gitleaks.tar.gz"
          GITLEAKS_BINARY="${RUNNER_TEMP}/gitleaks"
          curl -sSfL -o "$GITLEAKS_ARCHIVE" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" | sha256sum -c -
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$GITLEAKS_BINARY" /usr/local/bin/gitleaks
      - run: npm run ci
      - run: gitleaks dir . --redact --config .gitleaks.toml
      - run: gitleaks git . --redact --log-opts="--all" --config .gitleaks.toml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
      - run: npm run image:smoke

  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - redis_version: "6.2"
            redis_image: redis:6.2-alpine@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
          - redis_version: "7.2"
            redis_image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          - redis_version: "8.4"
            redis_image: redis:8.4-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    services:
      redis:
        image: ${{ matrix.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm --workspace packages/cli run test:integration
        env:
          TORIL_TEST_REDIS_URL: redis://127.0.0.1:6379

  ci-ok:
    if: always()
    needs: [static, image, doctor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DOCTOR_RESULT: ${{ needs.doctor.result }}
        run: >-
          test "$STATIC_RESULT" = success &&
          test "$IMAGE_RESULT" = success &&
          test "$DOCTOR_RESULT" = success
