name: npm package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the initial provenance RC or the Trusted Publishing final version
        required: true
        type: choice
        options:
          - bootstrap
          - final
      version:
        description: Exact release version without the v prefix
        required: true
        type: string

concurrency:
  group: npm-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PACKAGE_NAME: "@toril/cli"

jobs:
  publish:
    if: github.repository == 'CorgiCorner/toril'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate exact package source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Invalid release version"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./packages/cli/package.json').name")" = "$PACKAGE_NAME"
          test "$(git rev-list -n 1 "v$EXPECTED_VERSION")" = "$(git rev-parse HEAD)"
          test "$(node -p "require('./packages/cli/package.json').repository.url")" \
            = "git+https://github.com/CorgiCorner/toril.git"

      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm test
        env:
          TORIL_TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Review package contents
        run: npm pack --workspace packages/cli --dry-run --json

      - name: Check registry state
        id: preflight
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$MODE" = bootstrap ]; then
            PUBLISHED_VERSION="${VERSION}-rc.1"
          else
            PUBLISHED_VERSION="$VERSION"
          fi

          EXISTING_VERSION="$(npm view "$PACKAGE_NAME@$PUBLISHED_VERSION" version 2>/dev/null || true)"
          if [ "$EXISTING_VERSION" = "$PUBLISHED_VERSION" ]; then
            test "$(npm view "$PACKAGE_NAME@$PUBLISHED_VERSION" repository.url)" \
              = "git+https://github.com/CorgiCorner/toril.git" \
              || { echo "::error::Existing package is not owned by this repository"; exit 1; }
            echo "$PACKAGE_NAME@$PUBLISHED_VERSION already exists and will only be verified."
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING_OWNER="$(npm view "$PACKAGE_NAME" repository.url 2>/dev/null || true)"
          if [ -n "$EXISTING_OWNER" ] && \
             [ "$EXISTING_OWNER" != "git+https://github.com/CorgiCorner/toril.git" ]; then
            echo "::error::$PACKAGE_NAME is owned by another repository"
            exit 1
          fi

          echo "publish_needed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare bootstrap version
        if: inputs.mode == 'bootstrap'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm pkg set "version=${VERSION}-rc.1" --workspace packages/cli

      - name: Verify bootstrap before Trusted Publishing
        if: inputs.mode == 'final'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(npm view "$PACKAGE_NAME@${VERSION}-rc.1" version)" = "${VERSION}-rc.1"
          test "$(npm view "$PACKAGE_NAME@${VERSION}-rc.1" repository.url)" \
            = "git+https://github.com/CorgiCorner/toril.git"
          test "$(npm view "$PACKAGE_NAME@${VERSION}-rc.1" dist.attestations.provenance.predicateType)" \
            = "https://slsa.dev/provenance/v1"

      - run: npm install --global npm@11.15.0

      - name: Publish bootstrap RC with provenance
        if: inputs.mode == 'bootstrap' && steps.preflight.outputs.publish_needed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::NPM_BOOTSTRAP_TOKEN is not configured"; exit 1; }
          npm publish --workspace packages/cli --access public --tag next --provenance

      - name: Publish final version with Trusted Publishing
        if: inputs.mode == 'final' && steps.preflight.outputs.publish_needed == 'true'
        run: npm publish --workspace packages/cli --access public

      - name: Resolve published version
        id: published
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$MODE" = bootstrap ]; then
            echo "version=${VERSION}-rc.1" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for registry visibility
        env:
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if test "$(npm view "$PACKAGE_NAME@$PUBLISHED_VERSION" version 2>/dev/null || true)" = "$PUBLISHED_VERSION"; then
              exit 0
            fi
            echo "Attempt $attempt: npm has not exposed $PACKAGE_NAME@$PUBLISHED_VERSION yet; checking again in 10 seconds."
            sleep 10
          done
          echo "::error::npm did not expose $PACKAGE_NAME@$PUBLISHED_VERSION"
          exit 1

      - name: Verify clean installation, provenance, and runtime
        env:
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          CLEAN_DIR="$(mktemp -d)"
          cd "$CLEAN_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$PACKAGE_NAME@$PUBLISHED_VERSION"
          test "$(npm view "$PACKAGE_NAME@$PUBLISHED_VERSION" dist.attestations.provenance.predicateType)" \
            = "https://slsa.dev/provenance/v1"
          npm audit signatures
          test "$(npm exec --yes --package "$PACKAGE_NAME@$PUBLISHED_VERSION" -- toril --version)" \
            = "$PUBLISHED_VERSION"
          npm exec --yes --package "$PACKAGE_NAME@$PUBLISHED_VERSION" -- \
            toril --redis redis://127.0.0.1:6379 --json > doctor.json
          jq -e '
            .schemaVersion == 1 and
            .status == "pass" and
            ([.checks[].status] | all(. == "pass"))
          ' doctor.json >/dev/null
